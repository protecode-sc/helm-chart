{{- if .Values.frontend.applicationLogging.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bdba.fullname" . }}-webapp-fluentbit-config
  labels:
{{ include "bdba.labels" . | indent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Daemon       Off
        Flush        5
        Log_Level    info
        HTTP_Server  Off
        Parsers_File /bdba-fluentbit/parsers.conf
        storage.path /app-log/buffer/
        storage.sync normal
        storage.backlog.mem_limit 50M

    [INPUT]
        Name         tail
        Tag          webapp
        Path         /app-log/app.log*
        Parser       json
        DB           /app-log/app.db
        Rotate_Wait       60
        Refresh_Interval  5
        Skip_Long_Lines   On
        storage.type      filesystem
        Buffer_Max_Size   256k

    [FILTER]
        Name record_modifier
        Match *
        Record hostname ${HOSTNAME}

    [OUTPUT]
        Name         forward
        Match        *
        Host         {{ template "bdba.fluentd.fullname" . }}
        Retain_Metadata_In_Forward_Mode Off
        Retry_Limit  False
        storage.total_limit_size 256M

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

---
{{- end }}
